name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 提前對齊 GitHub Actions Node 24（2026-06-16 起強制）— 讓所有 JS actions 以 Node 24 執行，
# 消除 actions/checkout/setup-node/upload-artifact 的 Node 20 deprecation 警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Run tests (169+)
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Bundle size guard (< 400KB main bundle)
        run: |
          MAIN_SIZE=$(find dist/assets -name "index-*.js" -printf "%s\n" | head -1)
          echo "Main bundle: $MAIN_SIZE bytes"
          if [ "$MAIN_SIZE" -gt 400000 ]; then
            echo "::error::Main bundle exceeds 400KB ($MAIN_SIZE bytes)"
            exit 1
          fi

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  pw-version:
    # 讀出專案鎖定的 Playwright 版本，測試用同版本的官方環境（瀏覽器已內建，不必下載）
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "v=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright RWD Tests
    needs: [test, pw-version]
    runs-on: ubuntu-24.04
    # 在 Playwright 官方環境裡跑：瀏覽器已內建，不受測試機作業系統更新或下載站卡住影響
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.pw-version.outputs.v }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright RWD tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun || echo "Lighthouse warnings (non-blocking)"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
